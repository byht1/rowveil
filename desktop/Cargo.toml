# Rowveil desktop: the GPUI app (the `rowveil` binary of the releases).
# A separate workspace with its own Cargo.lock; it uses the root crate (the API router) as a library.
[package]
name = "rowveil-desktop"
version = "0.5.2"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "rowveil"
path = "src/main.rs"

[dependencies]
rowveil = { path = "..", default-features = false }
gpui-kit = { version = "0.11.0", features = ["tree-sitter-sql"] }
anyhow = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
sqlformat = "0.3"
clap = { version = "4", features = ["derive", "env"] }
lsp-types = { version = "0.97", features = ["proposed"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
