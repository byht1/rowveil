# Rowveil Next: the desktop UI rewritten with GPUI (alpha).
# A separate workspace with its own Cargo.lock: the stable app, its CI and releases do not build it.
[package]
name = "rowveil-next"
version = "0.5.0-alpha.1"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "rowveil-next"
path = "src/main.rs"

[dependencies]
rowveil = { path = "..", default-features = false }
gpui-kit = { version = "0.9.1", features = ["tree-sitter-sql"] }
anyhow = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
sqlformat = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
lsp-types = { version = "0.97", features = ["proposed"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
